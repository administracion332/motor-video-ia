name: Renderizar Videos Multiplataforma

on:
  repository_dispatch:
    types: [render_video]

jobs:
  build-videos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar FFmpeg y Python
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python3 -m pip install --upgrade pip
          pip install requests pillow faster-whisper auto-editor

      - name: Ejecutar edición IA y renderizado
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
        run: python3 render_video.py
